<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Personal Lexicon — Word Dictionary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="page">

    <!-- Cover / masthead -->
    <header class="masthead">
      <p class="masthead__eyebrow">Vol. I — Personal Edition</p>
      <h1 class="masthead__title">Personal Lexicon</h1>
      <p class="masthead__tagline">Every word you've decided is worth keeping.</p>
    </header>

    <!-- Guide words bar — mimics the running head of a real dictionary page -->
    <div class="guidebar" id="guidebar">
      <span class="guidebar__word" id="guideFirst">—</span>
      <span class="guidebar__count" id="entryCount">0 entries</span>
      <span class="guidebar__word" id="guideLast">—</span>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <div class="search">
        <label for="searchInput" class="visually-hidden">Search the lexicon</label>
        <input type="text" id="searchInput" placeholder="Search a word or meaning…" autocomplete="off">
      </div>
      <button class="btn btn--primary" id="openAddBtn">
        <span class="btn__mark">+</span> New entry
      </button>
    </div>

    <!-- Status / error strip -->
    <div class="status" id="statusStrip" role="status" aria-live="polite"></div>

    <!-- Entries -->
    <main>
      <ol class="entries" id="entries"></ol>

      <div class="empty" id="emptyState" hidden>
        <p class="empty__title">This page is blank.</p>
        <p class="empty__body">Add your first word to begin the lexicon.</p>
      </div>

      <div class="loading" id="loadingState">
        <p>Turning the page…</p>
      </div>
    </main>

  </div>

  <!-- Entry form — slides in as an index card, used for both add and edit -->
  <div class="scrim" id="scrim" hidden></div>
  <aside class="card-form" id="cardForm" hidden aria-hidden="true">
    <form id="entryForm">
      <p class="card-form__label" id="formLabel">New entry</p>

      <label class="field">
        <span class="field__label">Word</span>
        <input type="text" id="wordInput" name="word" required autocomplete="off" spellcheck="false">
      </label>

      <label class="field">
        <span class="field__label">Meaning</span>
        <textarea id="meaningInput" name="meaning" rows="4" required></textarea>
      </label>

      <div class="card-form__actions">
        <button type="button" class="btn btn--ghost" id="cancelBtn">Cancel</button>
        <button type="submit" class="btn btn--primary" id="saveBtn">Save entry</button>
      </div>
    </form>
  </aside>

  <script src="script.js"></script>
</body>
</html>
